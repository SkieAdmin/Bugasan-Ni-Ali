# nginx site for the Bugasan ni Ali API: perlas.ccshub.uk
# Cloudflare SSL mode is Flexible: Cloudflare does the HTTPS and talks to this server on port 80.
# Don't add an HTTP -> HTTPS redirect here (it would loop); use Cloudflare's "Always Use HTTPS".

server {
    listen 80;
    server_name perlas.ccshub.uk;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        # The visitor's real IP from Cloudflare, so the login limit counts each person separately.
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    }
}
